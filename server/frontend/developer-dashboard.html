<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Developer Dashboard | PropTech</title>
  <link rel="stylesheet" href="assets/css/global.css" />
  <link rel="stylesheet" href="assets/css/dashboard.css" />
  <style>
    dialog { border: 0; border-radius: 12px; padding: 24px; width: min(440px, 92vw); box-shadow: 0 10px 40px rgba(0,0,0,.25); }
    dialog::backdrop { background: rgba(0,0,0,.4); }
    dialog h2 { margin: 0 0 8px; }
    dialog label { display: block; margin: 12px 0 4px; font-size: .9rem; font-weight: 600; }
    dialog input, dialog select { width: 100%; padding: 10px; border: 1px solid #d5dae0; border-radius: 8px;
      font-size: 1rem; box-sizing: border-box; }
    .form-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
    #form-error { display: none; margin-top: 12px; padding: 10px; border-radius: 8px; background: #fdecea; color: #a12622; font-size: .9rem; }
    .section-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .section-head h2 { margin: 0; }
    .table-scroll { overflow-x: auto; }
  </style>
</head>
<body class="dash-body" data-page="developer">
  <header class="dash-header">
    <h1>Developer Dashboard</h1>
    <div>
      <span class="who" id="who"></span>
      <button class="btn" id="logout" type="button">Log out</button>
    </div>
  </header>

  <main class="dash-main">
    <section class="card">
      <div class="section-head">
        <h2>My listings</h2>
        <button class="btn" id="add-listing" type="button">+ Add listing</button>
      </div>
      <div class="table-scroll" id="listings"></div>
    </section>
  </main>

  <dialog id="listing-dialog">
    <form id="listing-form" novalidate>
      <h2 id="form-title">Add listing</h2>

      <label for="f-title">Title</label>
      <input id="f-title" type="text" maxlength="120" placeholder="e.g. 3BR Maisonette" required />

      <label for="f-location">Location</label>
      <input id="f-location" type="text" maxlength="120" placeholder="e.g. Athi River" />

      <label for="f-price">Price (KES)</label>
      <input id="f-price" type="number" min="1" step="1000" required />

      <label for="f-status">Status</label>
      <select id="f-status">
        <option value="available">Available</option>
        <option value="reserved">Reserved</option>
        <option value="sold">Sold</option>
      </select>

      <div id="form-error" role="alert"></div>

      <div class="form-actions">
        <button type="button" class="btn secondary" id="f-cancel">Cancel</button>
        <button type="submit" class="btn" id="f-save">Save</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="assets/js/dashboard.js"></script>
</body>
</html>
